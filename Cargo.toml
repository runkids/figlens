[package]
name = "figlens"
version = "0.9.3"
edition = "2024"
description = "Figma screens for coding agents, read from a saved .fig: REST-shaped nodes, variables, assets, renders and bundles, with no Figma app, login or API limit"
license = "MIT"
# Shipped as release binaries, Homebrew and npm; not on crates.io.
publish = false
repository = "https://github.com/runkids/figlens"
homepage = "https://github.com/runkids/figlens"
readme = "README.md"
keywords = ["figma", "fig", "design", "design-to-code", "cli"]
categories = ["command-line-utilities", "parser-implementations", "multimedia::images"]
include = ["src/**/*", "vendor/kiwi-schema/**/*", "skills/figlens/**/*", "scripts/make-first-success.rs", "scripts/probe-handoff.rs", "scripts/make-mapping-fixture.rs", "scripts/make-corpus.rs", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
caseless = "0.2.2"
flate2 = "1.1.10"
hmac = "0.13.0"
imagesize = "0.15.0"
jpeg-encoder = "0.7.1"
kiwi-schema = { version = "0.2.1", path = "vendor/kiwi-schema" }
rayon = "1.12.0"
# Bundled: the native binaries carry SQLite, so users install nothing.
rusqlite = { version = "0.41.1", features = ["bundled"] }
# No `asm`: it needs nasm in every cross-build.
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
resvg = { version = "0.48.1", default-features = false, features = ["raster-images"] }
ruzstd = "0.9.1"
serde_json = "1.0.154"
sha2 = "0.11.1"
unicode-normalization = "0.1.26"
webp = { version = "0.3.1", default-features = false }
zip = "9.0.5"
# `figlens-embed` only (feature `embed`): the local text model child of semantic search (#94).
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[features]
embed = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers"]

[[bin]]
name = "figlens"
path = "src/main.rs"

[[bin]]
name = "figlens-embed"
path = "src/bin/figlens-embed.rs"
required-features = ["embed"]

# Opening a registered source without following links.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The per-user Local AppData Known Folder, when %LOCALAPPDATA% is unset, hard-link counts and Ctrl-C.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_UI_Shell"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

[[example]]
name = "first-success-fixture"
path = "scripts/make-first-success.rs"

[[example]]
name = "handoff-probe"
path = "scripts/probe-handoff.rs"

[[example]]
name = "mapping-fixture"
path = "scripts/make-mapping-fixture.rs"

[[example]]
name = "fake-embed"
path = "scripts/fake-embed.rs"

[[example]]
name = "corpus-fixture"
path = "scripts/make-corpus.rs"
