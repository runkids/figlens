name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Draft PRs run nothing; marking one ready for review starts the full suite.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        type: string
        default: ""

concurrency:
  # A newer push to a pull request supersedes its running tests; other runs keep their own group.
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check AI context routes
        run: python3 scripts/ai-context.py check

      # The same toolchain as local development (compose.yaml `dev`).
      - name: Format, lint and test
        run: docker compose run --rm dev sh -c 'cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --locked'

      # Owned synthetic corpus against recorded baselines; exit 2 means setup, 1 means regression.
      - name: Design-corpus regression lane
        timeout-minutes: 10
        # mkdir runs in the container: `cargo test` above leaves a root-owned samples/.
        run: docker compose run --rm dev sh -c 'mkdir -p samples/corpus && cargo build --locked --bin figlens && cargo run --locked --example corpus-fixture -- samples/corpus/corpus.fig && python3 -B scripts/corpus-check.py --binary target/debug/figlens --corpus samples/corpus/corpus.fig'

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm wrapper
        working-directory: npm
        run: node --test

      - name: Pi mappings and preview controls
        run: |
          node --check pi/index.ts
          node --check omp/index.ts
          node --check opencode/index.mjs
          node --check opencode/tui.mjs
          node --test pi/*.test.mjs opencode/*.test.mjs omp/*.test.mjs scripts/preview.test.cjs scripts/dist-package.test.cjs scripts/e2e-fixture-plugin.test.mjs scripts/e2e-pilot-images.test.mjs
          python3 -B -m unittest discover -s scripts -p '*_test.py'
          python3 -B scripts/e2e-owned-pilot.test.py
          node scripts/prepare-npm.cjs
          cd npm
          npm pack --dry-run --ignore-scripts

  # Releases ship a Windows build, and the Linux job above cannot catch a Windows-only failure
  # (paths, %LOCALAPPDATA%, gcloud.cmd). Native MSVC here; the release cross-builds windows-gnu.
  windows:
    if: github.event.pull_request.draft != true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pi viewer process lifecycle
        run: node --test pi/viewer.test.mjs
      - name: OpenCode watch holder process lifecycle
        shell: bash
        # Bounded, so a hung child fails with the test that waited on it instead of holding the job.
        timeout-minutes: 10
        run: node --test --test-timeout=120000 opencode/watch-holder.test.mjs && node --test --test-timeout=120000 --test-name-pattern="CLI-path watch" opencode/adapter.test.mjs
      - name: Test
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 test --locked

  # Build each release-format target once; all installation jobs reuse these exact artifacts.
  # Independent of `test` so the installation jobs start as soon as the archives exist.
  # One runner per target: each fat-LTO release build takes about two minutes, so building
  # them one after another held every installation job back by the sum.
  candidate-build:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-apple-darwin, x86_64-pc-windows-gnu]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # Building the toolchain image took about 80 s per runner, mostly `rustup target add`.
      # The cache only stores layers: Dockerfile.dist still decides the image, and releases build their own.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.dist
          tags: figlens-dist
          load: true
          cache-from: type=gha,scope=dist
          cache-to: type=gha,mode=max,scope=dist
      - name: Build the candidate archive in the pinned release toolchain
        env:
          FIGLENS_TARGETS: ${{ matrix.target }}
        run: |
          mkdir -p dist/candidate
          docker compose run --rm \
            -e FIGLENS_TARGETS -e FIGLENS_DIST_DIR=dist/candidate \
            dist scripts/build-dist.sh
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.target }}
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 1

  candidate:
    needs: candidate-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-*
          path: dist/parts
      - name: Pack real npm tarball and bind artifacts to this checkout
        run: |
          # Each build wrote the SHA256SUMS of its own archive; the packer checks every archive against them.
          mkdir dist/candidate
          mv dist/parts/*/figlens-* dist/candidate/
          cat dist/parts/*/SHA256SUMS > dist/candidate/SHA256SUMS
          python3 -B scripts/pack-candidate.py dist/candidate
          python3 -c 'import json; assert not json.load(open("dist/candidate/candidate.json"))["dirty"], "Candidate source differs from checkout"'
      - uses: actions/upload-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 3

  installation:
    needs: candidate
    # The margin is for runner start-up: macOS runners have taken over 15 minutes before the first step.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact CLI floor, separate from Pi's >=22.19.0 runtime requirement.
          - os: ubuntu-latest
            node: "18.0.0"
            pi: ""
          - os: ubuntu-latest
            node: "22.19.0"
            pi: "1.3.0"
          - os: macos-15
            node: "24"
            pi: "1.4.0"
          - os: windows-latest
            node: "24"
            pi: "1.4.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
      - name: Installed CLI, cold cache, stdio MCP and optional real Pi loader
        shell: bash
        env:
          PI_VERSION: ${{ matrix.pi }}
          # The default TEMP on Windows runners is on C:, where installing the Pi SDK's 15k files
          # took 108 s against 10 s on the runner's D: work drive.
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          args=(--artifacts dist/candidate --commit "$(git rev-parse HEAD)")
          if [ -n "$PI_VERSION" ]; then args+=(--pi-version "$PI_VERSION"); fi
          python -B scripts/check-installation.py "${args[@]}"

  host-installation:
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      # The fixture needs about a minute and only this checkout, so it builds while the steps below
      # set up the hosts. It stays on this runner: only the first-success design is distributable.
      - name: Start the original local mapping fixture
        run: |
          mkdir -p samples/plugin-research/fixtures
          # `|| status=$?` keeps the step's `bash -e` from ending the subshell before it records a failure.
          (status=0
           docker compose run --rm dev cargo run --locked --example mapping-fixture -- samples/plugin-research/fixtures/mapping.fig \
             > "$RUNNER_TEMP/fixture.log" 2>&1 || status=$?
           echo "$status" > "$RUNNER_TEMP/fixture.tmp"; mv "$RUNNER_TEMP/fixture.tmp" "$RUNNER_TEMP/fixture.status") &
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/download-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
      - name: Install isolated fixed host SDKs and verify OpenCode runtime bytes
        run: |
          npm install --prefix samples/plugin-research/hosts/omp --ignore-scripts --no-audit --no-fund @oh-my-pi/pi-coding-agent@18.13.2
          npm install --prefix samples/plugin-research/hosts/opencode --ignore-scripts --no-audit --no-fund @opencode/plugin@2.2.0
          curl --fail --location --output samples/plugin-research/hosts/opencode/runtime.tar.gz https://github.com/anomalyco/opencode/releases/download/v2.2.0/opencode-linux-x64.tar.gz
          echo '6d597970a8cc448f1b9a9f645532584b339dd3ab9583bb5f063f13d83e54768f  samples/plugin-research/hosts/opencode/runtime.tar.gz' | sha256sum --check
          tar -xzf samples/plugin-research/hosts/opencode/runtime.tar.gz -C samples/plugin-research/hosts/opencode
      - name: Wait for the mapping fixture
        run: |
          until [ -f "$RUNNER_TEMP/fixture.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/fixture.log"
          exit "$(cat "$RUNNER_TEMP/fixture.status")"
      - name: Same candidate, native loaders, MCP, review and cleanup without models
        run: |
          python3 -B scripts/check-installation.py \
            --artifacts dist/candidate --commit "$(git rev-parse HEAD)" \
            --pi-version 1.4.0 \
            --opencode-bin samples/plugin-research/hosts/opencode/opencode \
            --opencode-sdk samples/plugin-research/hosts/opencode/node_modules/@opencode/client \
            --omp-sdk samples/plugin-research/hosts/omp/node_modules/@oh-my-pi/pi-coding-agent \
            --bun "$(command -v bun)"

  # The OpenCode and OMP watch and stale-context checks on the public design, on the other OSes;
  # the full host lane above, with the mapping fixture, stays on Linux.
  host-watch:
    needs: candidate
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            opencode: opencode-darwin-arm64.zip
            binary: opencode
            sha256: c71b1cd96541539ad38e2a75377d2f43d2a27567289a14371a182e9a0800db3d
          - os: windows-latest
            opencode: opencode-windows-x64.zip
            binary: opencode.exe
            sha256: a56307bdccdafd3fc5255556f3bf867703ea56dbeffaf00add4e9663edb3b974
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"
      - uses: actions/download-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
      - name: Install isolated fixed host SDKs and verify OpenCode runtime bytes
        shell: bash
        env:
          ASSET: ${{ matrix.opencode }}
          SHA256: ${{ matrix.sha256 }}
        run: |
          npm install --prefix samples/plugin-research/hosts/omp --ignore-scripts --no-audit --no-fund @oh-my-pi/pi-coding-agent@18.13.2
          npm install --prefix samples/plugin-research/hosts/opencode --ignore-scripts --no-audit --no-fund @opencode/plugin@2.2.0
          curl --fail --location --output "samples/plugin-research/hosts/opencode/$ASSET" "https://github.com/anomalyco/opencode/releases/download/v2.2.0/$ASSET"
          python -B -I - "samples/plugin-research/hosts/opencode/$ASSET" "$SHA256" samples/plugin-research/hosts/opencode <<'PY'
          import hashlib, sys, zipfile
          path, want, out = sys.argv[1:]
          with open(path, 'rb') as f: got = hashlib.sha256(f.read()).hexdigest()
          assert got == want, f'{path}: sha256 {got}, expected {want}'
          with zipfile.ZipFile(path) as z: z.extractall(out)
          PY
          chmod +x samples/plugin-research/hosts/opencode/${{ matrix.binary }}
      - name: Same candidate, OpenCode and OMP watch and stale context without models
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        # Python resolves bun: Git Bash on Windows would print a /c/... path Python cannot open.
        run: |
          python -B scripts/check-installation.py \
            --artifacts dist/candidate --commit "$(git rev-parse HEAD)" --host-watch-only \
            --opencode-bin samples/plugin-research/hosts/opencode/${{ matrix.binary }} \
            --opencode-sdk samples/plugin-research/hosts/opencode/node_modules/@opencode/client \
            --omp-sdk samples/plugin-research/hosts/omp/node_modules/@oh-my-pi/pi-coding-agent \
            --bun "$(python -c 'import shutil; print(shutil.which("bun"))')"
