name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        type: string
        default: ""

concurrency:
  # A newer push to a pull request supersedes its running tests; other runs keep their own group.
  group: test-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check AI context routes
        run: python3 scripts/ai-context.py check

      # The same toolchain as local development (compose.yaml `dev`).
      - name: Format, lint and test
        run: docker compose run --rm dev sh -c 'cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test --locked'

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm wrapper
        working-directory: npm
        run: node --test

      - name: Pi mappings and preview controls
        run: |
          node --check pi/index.ts
          node --test pi/*.test.mjs scripts/preview.test.cjs scripts/dist-package.test.cjs
          python3 -B -m unittest discover -s scripts -p '*_test.py'
          node scripts/prepare-npm.cjs
          cd npm
          npm pack --dry-run --ignore-scripts

  # Releases ship a Windows build, and the Linux job above cannot catch a Windows-only failure
  # (paths, %LOCALAPPDATA%, gcloud.cmd). Native MSVC here; the release cross-builds windows-gnu.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Pi viewer process lifecycle
        run: node --test pi/viewer.test.mjs
      - name: Test
        shell: bash
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 test --locked

  # Build each release-format target once; all installation jobs reuse these exact artifacts.
  candidate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build candidate binaries in the pinned release toolchain
        env:
          FIGLENS_TARGETS: x86_64-unknown-linux-musl aarch64-apple-darwin x86_64-pc-windows-gnu
        run: |
          # The host npm packer needs to write beside the container-built archives.
          mkdir -p dist/candidate
          docker compose run --build --rm \
            -e FIGLENS_TARGETS -e FIGLENS_DIST_DIR=dist/candidate \
            dist scripts/build-dist.sh
      - name: Pack real npm tarball and bind artifacts to this checkout
        run: |
          python3 -B scripts/pack-candidate.py dist/candidate
          python3 -c 'import json; assert not json.load(open("dist/candidate/candidate.json"))["dirty"], "Candidate source differs from checkout"'
      - uses: actions/upload-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
          if-no-files-found: error
          retention-days: 3

  installation:
    needs: candidate
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Exact CLI floor, separate from Pi's >=22.19.0 runtime requirement.
          - os: ubuntu-latest
            node: "18.0.0"
            pi: ""
          - os: ubuntu-latest
            node: "22.19.0"
            pi: "1.3.0"
          - os: macos-15
            node: "24"
            pi: "1.4.0"
          - os: windows-latest
            node: "24"
            pi: "1.4.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: installation-candidate
          path: dist/candidate/
      - name: Installed CLI, cold cache, stdio MCP and optional real Pi loader
        shell: bash
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          args=(--artifacts dist/candidate --commit "$(git rev-parse HEAD)")
          if [ -n "$PI_VERSION" ]; then args+=(--pi-version "$PI_VERSION"); fi
          python -B scripts/check-installation.py "${args[@]}"
