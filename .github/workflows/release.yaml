name: Build Release Draft

# Push a tag v<Cargo.toml version> to build every archive into a draft release.
# Check the draft, then run "Publish Release" to make it public and distribute it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (e.g. v0.1.0)
        required: true
        type: string

concurrency:
  group: release-draft-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: The tag must match Cargo.toml and npm/package.json
        id: resolve
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          npm_version=$(node -p 'require("./npm/package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG != Cargo.toml v$version" >&2; exit 1; }
          test "$npm_version" = "$version" || { echo "npm/package.json $npm_version != $version" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  draft:
    needs: [resolve, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Dockerfile.dist pins its base image by digest, and cargo-zigbuild cross-builds macOS too.
      - name: Build the archives
        run: scripts/dist.sh

      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true \
              || { echo "$TAG is already published; not touching it" >&2; exit 1; }
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG"
          fi
