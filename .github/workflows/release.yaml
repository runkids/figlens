name: Build Release Draft

# Called by "Release Please" after it tags a tested commit; builds every archive into the draft.
# Run it by hand to rebuild an existing draft. Check the draft, then run "Publish Release".
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      sha:
        description: Commit already tested before tagging
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to rebuild (e.g. v0.1.0)
        required: true
        type: string

concurrency:
  group: release-draft-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: The tag must match Cargo.toml and npm/package.json
        id: resolve
        env:
          TAG: ${{ inputs.tag }}
          APPROVED_SHA: ${{ inputs.sha }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          npm_version=$(node -p 'require("./npm/package.json").version')
          test "$TAG" = "v$version" || { echo "tag $TAG != Cargo.toml v$version" >&2; exit 1; }
          test "$npm_version" = "$version" || { echo "npm/package.json $npm_version != $version" >&2; exit 1; }
          sha=$(git rev-parse HEAD)
          test -z "$APPROVED_SHA" || test "$sha" = "$APPROVED_SHA" \
            || { echo "$TAG is $sha, not the tested $APPROVED_SHA" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Release Please already tested the commit it tagged.
  test:
    needs: resolve
    if: inputs.sha == ''
    uses: ./.github/workflows/test.yaml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  draft:
    needs: [resolve, test]
    if: always() && needs.resolve.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      # Dockerfile.dist pins its base image by digest, and cargo-zigbuild cross-builds macOS too.
      - name: Build the archives
        run: scripts/dist.sh

      - name: Create or refresh the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true \
              || { echo "$TAG is already published; not touching it" >&2; exit 1; }
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag --generate-notes --title "$TAG"
          fi
