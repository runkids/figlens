name: Publish Release

# Makes a checked draft public, then ships it to Homebrew and npm.
# Secrets: HOMEBREW_TAP_SSH_KEY (write deploy key on runkids/homebrew-tap). npm needs none: it trusts
# this workflow through OIDC (Trusted Publisher on npmjs.com: runkids/figlens, publish-release.yml).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft to publish (e.g. v0.1.0)
        type: string
        required: true

concurrency:
  group: publish-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Verify the draft's archives against its checksums
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          test "$TAG" = "v$version"
          gh release download "$TAG" --dir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          sha256sum -c SHA256SUMS
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true; then
            gh release edit "$TAG" --draft=false --latest
          fi

  # A release published with GITHUB_TOKEN starts no workflows, so Homebrew is called directly.
  homebrew:
    needs: publish
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag_name: ${{ inputs.tag }}
    secrets: inherit

  npm:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; provenance is attached automatically.
      - run: npm install -g npm@^11.5.1
      - name: npm publish
        working-directory: npm
        run: npm publish --access public
